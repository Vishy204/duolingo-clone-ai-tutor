name: Keep API warm
# Render's free tier sleeps after ~15 idle minutes and then takes 30-50s to wake, which made the first
# voice chat (and first page load) feel broken. A light ping every 10 minutes keeps it awake.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 https://smartalingo-api.onrender.com/health

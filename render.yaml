# Render Blueprint: backend API (FastAPI + SQLite + agents + voice).
# Secrets are declared with `sync: false` so Render asks for them in the dashboard; they are
# never stored in this repo.
services:
  - type: web
    name: smartalingo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://(smartalingo|duolingo-clone-ai-tutor).*\.vercel\.app
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: DEMO_MODE
        value: "true"
      - key: AGENT_DAILY_BUDGET
        value: "15"
      - key: VOICE_LLM_PROVIDER
        value: cerebras
